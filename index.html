<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("falling-petals", {
        schema: {
          count: { default: 50 }
        },
        init: function () {
          this.petals = [];
          var el = this.el;
          var colors = ["#FFB7C5", "#FFC8D3", "#FFAEC0", "#FF91A8", "#FFD6DF"];

          for (var i = 0; i < this.data.count; i++) {
            var petal = document.createElement("a-entity");

            // 꽃잎 모양: 납작한 타원형 (plane 2개를 살짝 꺾어서 입체감)
            var inner = document.createElement("a-plane");
            var w = 0.12 + Math.random() * 0.1;
            var h = w * 0.55;
            var color = colors[Math.floor(Math.random() * colors.length)];
            inner.setAttribute("width",  w);
            inner.setAttribute("height", h);
            inner.setAttribute("material", "color: " + color + "; side: double; opacity: 0.82; transparent: true; shader: flat;");
            inner.setAttribute("rotation", "30 0 0");
            petal.appendChild(inner);

            var state = this.resetPetal({}, true);
            petal.setAttribute("position", state.x + " " + state.y + " " + state.z);
            petal.setAttribute("rotation", state.rotX + " " + state.rotY + " " + state.rotZ);

            state.el = petal;
            this.petals.push(state);
            el.appendChild(petal);
          }
        },

        resetPetal: function (p, init) {
          p.x          = (Math.random() - 0.5) * 24;
          p.y          = init ? (Math.random() * 20 - 2) : (12 + Math.random() * 6);
          p.z          = (Math.random() - 0.5) * 12 - 1;
          p.speedY     = 0.6 + Math.random() * 0.9;
          p.rotX       = Math.random() * 360;
          p.rotY       = Math.random() * 360;
          p.rotZ       = Math.random() * 360;
          p.rotSpeedX  = (Math.random() - 0.5) * 60;
          p.rotSpeedZ  = (Math.random() - 0.5) * 80;
          p.swayOffset = Math.random() * Math.PI * 2;
          p.swaySpeed  = 0.6 + Math.random() * 0.8;
          p.swayAmt    = 0.4 + Math.random() * 0.6;
          return p;
        },

        tick: function (time, delta) {
          var dt = delta / 1000;
          var self = this;
          this.petals.forEach(function (p) {
            p.y -= p.speedY * dt;
            p.swayOffset += p.swaySpeed * dt;
            p.x += Math.sin(p.swayOffset) * p.swayAmt * dt;
            p.rotX += p.rotSpeedX * dt;
            p.rotZ += p.rotSpeedZ * dt;

            if (p.y < -4) self.resetPetal(p, false);

            p.el.setAttribute("position", p.x + " " + p.y + " " + p.z);
            p.el.setAttribute("rotation", p.rotX + " " + p.rotY + " " + p.rotZ);
          });
        }
      });

      AFRAME.registerComponent("sparkle-sound", {
        init: function () {
          var self = this;
          var started = false;

          function playSparkle() {
            var ctx = self.audioCtx;
            if (!ctx || ctx.state === "suspended") return;

            // 뾰로롱 아르페지오 음계 (C5~E6 오름차순)
            var notes = [523, 659, 784, 1047, 1319];
            notes.forEach(function (freq, i) {
              setTimeout(function () {
                var osc  = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                // 짧은 attack, 빠른 decay → 뾰로롱 느낌
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.35);
              }, i * 70);
            });
          }

          // 브라우저 정책: 사용자 클릭 후 AudioContext 활성화
          function startAudio() {
            if (started) return;
            started = true;
            self.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            playSparkle();
            self.interval = setInterval(playSparkle, 4000);
          }

          document.addEventListener("click", startAudio, { once: true });
          document.addEventListener("keydown", startAudio, { once: true });
        },
        remove: function () {
          clearInterval(this.interval);
          if (this.audioCtx) this.audioCtx.close();
        }
      });

      AFRAME.registerComponent("mint-star", {
        schema: {
          outerRadius: { default: 0.42 },
          innerRadius: { default: 0.18 },
          points:      { default: 5 },
          depth:       { default: 0.12 }
        },
        init: function () {
          var d = this.data;
          var shape = new THREE.Shape();
          var total = d.points * 2;
          for (var i = 0; i <= total; i++) {
            var angle = (i / total) * Math.PI * 2 - Math.PI / 2;
            var r = (i % 2 === 0) ? d.outerRadius : d.innerRadius;
            var x = Math.cos(angle) * r;
            var y = Math.sin(angle) * r;
            if (i === 0) shape.moveTo(x, y);
            else shape.lineTo(x, y);
          }
          var geo = new THREE.ExtrudeGeometry(shape, { depth: d.depth, bevelEnabled: false });
          var mat = new THREE.MeshStandardMaterial({ color: 0x2DD4BF, metalness: 0.2, roughness: 0.45 });
          var mesh = new THREE.Mesh(geo, mat);
          mesh.position.z = -d.depth / 2;
          this.el.object3D.add(mesh);
        }
      });

      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
    </style>
  </head>
  <body>
    <a-scene background="color: #020617">
      <a-assets>
        <a-asset-item id="my-model" src="이채령_202602016_DP_02반_10주차실습 (1).glb"></a-asset-item>
      </a-assets>
      <a-entity starfield></a-entity>
      <a-entity falling-petals="count: 50"></a-entity>

      <a-entity light="type: ambient; color: #667085; intensity: 0.8"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.2; distance: 90"
        position="0 6 6"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>

        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;"
        >
          <a-gltf-model
            src="#my-model"
            position="2.8 0.2 0"
            scale="0.42 0.42 0.42"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear;"
          ></a-gltf-model>
        </a-entity>

        <a-entity
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 16000; easing: linear;"
        >
          <a-sphere
            position="4.2 -0.1 0"
            radius="1.3"
            color="#2B2354"
            material="metalness: 0.2; roughness: 0.55;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;"
          ></a-sphere>
        </a-entity>

        <a-entity
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear;"
        >
          <!-- 민트색 별 -->
          <a-entity
            mint-star
            sparkle-sound
            position="5.6 0.35 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear;"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
